name: Build and publish Brother SinRoot assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-assets.yml"
      - ".github/scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upgrade application and guide to version 1.6.1
        run: python3 .github/scripts/prepare_release_1_6.py

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter python3-venv poppler-utils
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install weasyprint

      - name: Obtain and verify the original Brother driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drivers
          curl --fail --location --retry 3 \
            https://download.brother.com/welcome/dlf104033/brscan5-1.8.0-0.amd64.deb \
            --output drivers/brscan5-1.8.0-0.amd64.deb
          echo "27bf1d561da2223c9807726cc3ec1bd9e7cdce419a27ee79b31a642073174d46  drivers/brscan5-1.8.0-0.amd64.deb" | sha256sum --check
          dpkg-deb -f drivers/brscan5-1.8.0-0.amd64.deb Package Version Architecture

      - name: Generate and verify five-page A4 PDF guide
        shell: bash
        run: |
          set -euo pipefail
          ./.ci-venv/bin/python - <<'PY'
          from weasyprint import HTML
          HTML(filename="docs/source/guia.html", base_url="docs/source").write_pdf(
              "docs/Guia_Brother_MFC-J5740DW_SinRoot.pdf"
          )
          PY
          pdfinfo docs/Guia_Brother_MFC-J5740DW_SinRoot.pdf | grep -E "Pages: *5|Page size:.*A4"
          pdffonts docs/Guia_Brother_MFC-J5740DW_SinRoot.pdf | grep -qi Inter

      - name: Validate application and scripts
        run: |
          set -euo pipefail
          python3 -m py_compile app.py
          bash -n instalar.sh iniciar.sh desinstalar.sh AppRun build_appimage.sh
          test -s docs/Guia_Brother_MFC-J5740DW_SinRoot.pdf
          test -s drivers/brscan5-1.8.0-0.amd64.deb

      - name: Publish restored source and generated guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py docs/source/guia.html docs/source/guia.html.gz.b64 docs/Guia_Brother_MFC-J5740DW_SinRoot.pdf drivers/brscan5-1.8.0-0.amd64.deb README.md VERSION.txt CHANGELOG.md docs/README_INSTALACION.md docs/REFERENCIAS.md brother-mfc-j5740dw.desktop assets/brother-mfc-j5740dw.png
          if ! git diff --cached --quiet; then
            git commit -m "release: publish Brother SinRoot 1.6.0 sources and guide"
            git push
          fi
