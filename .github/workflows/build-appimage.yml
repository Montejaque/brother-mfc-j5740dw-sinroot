name: Build AppImage and ZIP

on:
  workflow_run:
    workflows: ["Build and publish Brother SinRoot assets"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Prepare Ubuntu 20.04 build environment
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Mantener glibc 2.31 como base compatible con Ubuntu 20.04 de destino.
          cat > /etc/apt/sources.list <<'APT'
          deb http://archive.ubuntu.com/ubuntu focal main universe restricted multiverse
          deb http://archive.ubuntu.com/ubuntu focal-updates main universe restricted multiverse
          deb http://security.ubuntu.com/ubuntu focal-security main universe restricted multiverse
          deb http://archive.ubuntu.com/ubuntu focal-backports main universe restricted multiverse
          APT
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget file binutils gcc make \
            python3 python3-dev python3-pip python3-tk \
            tk8.6-dev zlib1g-dev libffi-dev libssl-dev \
            squashfs-tools desktop-file-utils zip unzip xvfb \
            libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 libfuse2
          python3 -m pip install --upgrade 'pip<25.1'
      - uses: actions/checkout@v4
      - name: Validate source and DEB integrity
        run: |
          set -euo pipefail
          python3 -m py_compile app.py
          bash -n instalar.sh iniciar.sh desinstalar.sh AppRun build_appimage.sh
          echo "27bf1d561da2223c9807726cc3ec1bd9e7cdce419a27ee79b31a642073174d46  drivers/brscan5-1.8.0-0.amd64.deb" | sha256sum --check
      - name: Build portable AppImage
        run: ./build_appimage.sh
      - name: Test final AppImage with virtual display
        shell: bash
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 8s xvfb-run -a dist/Brother_MFC-J5740DW_SinRoot_1.6.1-x86_64.AppImage
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "El AppImage terminó antes del tiempo de prueba (código $code)."
            exit 1
          fi
      - name: Test packaged executable with virtual display
        shell: bash
        run: |
          set +e
          timeout 8s xvfb-run -a build/pyinstaller-dist/brother-mfc-j5740dw/brother-mfc-j5740dw
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "La interfaz terminó antes del tiempo de prueba (código $code)."
            exit 1
          fi
      - name: Create full project ZIP with AppImage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F': ' '/^Versión:/ {print $2; exit}' VERSION.txt)"
          STAGE="dist/Brother_MFC-J5740DW_SinRoot_${VERSION}"
          mkdir -p "$STAGE"
          for item in app.py instalar.sh iniciar.sh desinstalar.sh README.md VERSION.txt CHANGELOG.md drivers docs assets AppRun brother-mfc-j5740dw.desktop build_appimage.sh; do
            [ ! -e "$item" ] || cp -a "$item" "$STAGE/"
          done
          cp "dist/Brother_MFC-J5740DW_SinRoot_${VERSION}-x86_64.AppImage" "$STAGE/"
          (cd dist && zip -qr "Brother_MFC-J5740DW_SinRoot_${VERSION}.zip" "Brother_MFC-J5740DW_SinRoot_${VERSION}")
          sha256sum dist/*.AppImage dist/*.zip
      - name: Upload AppImage, ZIP and PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brother_MFC-J5740DW_SinRoot-1.6.1-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.zip
            docs/Guia_Brother_MFC-J5740DW_SinRoot.pdf
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Brother_MFC-J5740DW_SinRoot-1.6.1-linux-x86_64
          path: release-assets

      - name: Prepare release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets-flat
          find release-assets -type f \\( -name '*.AppImage' -o -name '*.zip' -o -name '*.pdf' \\) -exec cp -t /tmp/release-assets-flat -- {} +
          test -s /tmp/release-assets-flat/Brother_MFC-J5740DW_SinRoot_1.6.1-x86_64.AppImage
          test -s /tmp/release-assets-flat/Brother_MFC-J5740DW_SinRoot_1.6.1.zip
          test -s /tmp/release-assets-flat/Guia_Brother_MFC-J5740DW_SinRoot.pdf
          rm -rf release-assets
          mv /tmp/release-assets-flat release-assets
          cd release-assets
          sha256sum \
            Brother_MFC-J5740DW_SinRoot_1.6.1-x86_64.AppImage \
            Brother_MFC-J5740DW_SinRoot_1.6.1.zip \
            Guia_Brother_MFC-J5740DW_SinRoot.pdf > SHA256SUMS

      - name: Publish version 1.6.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: Brother MFC-J5740DW SinRoot 1.6.1
          body: |
            ## Brother MFC-J5740DW SinRoot 1.6.1

            Versión para Ubuntu/Debian x86_64, con interfaz gráfica y configuración del escáner Brother MFC-J5740DW sin privilegios de administrador.

            ### Archivos
            - **AppImage:** ejecutable de la aplicación para Linux x86_64.
            - **ZIP:** proyecto portable completo, con código, documentación y recursos.
            - **Guía PDF:** manual de instalación y uso, cinco páginas A4 con tipografía Inter.
            - **SHA256SUMS:** comprobación de integridad de las descargas.

            ### Identidad visual
            Amarillo corporativo #F3D54E y negro #000000.

            ### Requisitos importantes
            El AppImage incluye Python y Tkinter. El sistema debe disponer de bubblewrap (bwrap), SANE y simple-scan para las funciones de escaneo.
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

